TITLE:
  - "2D monolithic ALE-FSI: rigid channel with thin elastic TOP plate"
  - "Fluid 48x10 QUAD4 on [0,1.0]x[0,0.2], mu=1.0, rho=1.0"
  - "Structure 48x8 WALL QUAD4 on [0,1.0]x[0.2,0.25], E=3000000.0, nu=0.3, rho=1.0"
  - "Inflow parabolic, U_MEAN=1.0; outlet do-nothing; run to steady state"
  - "FSI: iter_monolithicfluidsplit, UMFPACK direct"
PROBLEM SIZE:
  DIM: 2
PROBLEM TYPE:
  PROBLEMTYPE: "Fluid_Structure_Interaction"
IO:
  VERBOSITY: "Standard"
  STRUCT_DISP: true
  FLUID_STRESS: true
IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 1
  OUTPUT_DATA_FORMAT: ascii
  COMPRESSION_LEVEL: no_compression
IO/RUNTIME VTK OUTPUT/FLUID:
  OUTPUT_FLUID: true
  VELOCITY: true
  PRESSURE: true
  DISPLACEMENT: true
  NODE_GID: true
STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "GenAlpha"
  PREDICT: "ConstVel"
  LINEAR_SOLVER: 1
  TIMESTEP: 0.005
  NUMSTEP: 400
  MAXTIME: 2.0
  RESULTSEVERY: 1
STRUCTURAL DYNAMIC/GENALPHA:
  BETA: 0.5
  GAMMA: 1
  ALPHA_M: 0
  ALPHA_F: 0
  RHO_INF: -1
FLUID DYNAMIC:
  PHYSICAL_TYPE: "Incompressible"
  TIMEINTEGR: "One_Step_Theta"
  NONLINITER: Newton
  LINEAR_SOLVER: 1
  THETA: 1
  TIMESTEP: 0.005
  NUMSTEP: 400
  MAXTIME: 2.0
  RESULTSEVERY: 1
  ITEMAX: 20
FLUID DYNAMIC/RESIDUAL-BASED STABILIZATION:
  CHARELELENGTH_PC: "root_of_volume"
ALE DYNAMIC:
  ALE_TYPE: springs_material
  UPDATEMATRIX: true
  LINEAR_SOLVER: 1
  TIMESTEP: 0.005
  NUMSTEP: 400
  MAXTIME: 2.0
  RESULTSEVERY: 1
FSI DYNAMIC:
  COUPALGO: "iter_monolithicfluidsplit"
  TIMESTEP: 0.005
  NUMSTEP: 400
  MAXTIME: 2.0
  RESULTSEVERY: 1
  RESTARTEVERY: 400
